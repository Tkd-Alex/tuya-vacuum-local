clean_room_by_name:
  name: Clean a room by its name
  description: Sends the vacuum to a specific room using its configured name.
  fields:
    room_name:
      name: Room Name
      description: The name of the room as configured in the integration options.
      example: "Kitchen"
      required: true
    suction:
      name: Suction Level
      description: Optional suction level (1=gentle, 2=normal, 3=strong, 4=max).
      example: 2
      required: false
    water:
      name: Water Level
      description: Optional water level (0=off, 1=low, 2=middle, 3=high).
      example: 1
      required: false

refresh_map:
  name: Refresh Map
  description: Forces an immediate map update from Tuya Cloud.

start_room_capture:
  name: Start Room Template Capture
  description: >
    Listens passively for room-clean commands sent by the official Tuya app
    to capture device-specific room frame templates (b1/b2 bytes).
    Start this, then clean ONE room at a time from the Tuya app within the
    capture window.
  fields:
    entity_id:
      name: Vacuum Entity
      description: The vacuum entity to calibrate.
      required: false
      selector:
        entity:
          domain: vacuum
    config_entry_id:
      name: Config Entry ID
      description: Optional Home Assistant config entry ID.
      required: false
    duration:
      name: Duration
      description: Capture window in seconds (default 300 = 5 minutes).
      default: 300
      required: false
      selector:
        number:
          min: 60
          max: 1800
          unit_of_measurement: seconds

stop_room_capture:
  name: Stop Room Template Capture
  description: Stops the active room template capture session.
  fields:
    entity_id:
      name: Vacuum Entity
      description: The vacuum entity whose calibration to stop.
      required: false
      selector:
        entity:
          domain: vacuum
    config_entry_id:
      name: Config Entry ID
      description: Optional Home Assistant config entry ID.
      required: false
